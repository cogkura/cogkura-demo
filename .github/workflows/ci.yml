name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Sync dependencies
        run: uv sync --project apps/api --dev --locked
      - name: Ruff check
        run: uv run --project apps/api ruff check apps/api
      - name: Ruff format
        run: uv run --project apps/api ruff format --check apps/api
      - name: Mypy
        run: uv run --project apps/api mypy apps/api/src
      - name: Pytest
        run: uv run --project apps/api pytest apps/api/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci --prefix apps/web
      - name: Lint
        run: npm run lint --prefix apps/web
      - name: Typecheck
        run: npm run typecheck --prefix apps/web
      - name: Build
        run: npm run build --prefix apps/web
